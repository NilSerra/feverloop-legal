<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FeverLoop - Authorization Successful</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #09090b;
      color: #f4f4f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #141417;
      border: 1px solid #27272a;
      border-radius: 16px;
      padding: 40px 30px;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 { color: #10b981; margin: 15px 0 10px; font-size: 24px; font-weight: 700; }
    p { color: #a1a1aa; font-size: 15px; line-height: 1.5; margin-bottom: 24px; }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #27272a;
      border-top-color: #fe2c55;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      display: inline-block;
      background: #fe2c55;
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size: 48px;">🎉</div>
    <h1>TikTok Account Connected!</h1>
    <p>Authorization was successful for <b>@feverloop.official</b>.<br>Copy the authorization code below:</p>
    <div id="codeDisplay" style="background:#0d0d10;border:1px solid #3f3f46;border-radius:8px;padding:12px;font-family:monospace;font-size:12px;color:#38bdf8;word-break:break-all;margin:16px 0;text-align:left;max-height:100px;overflow-y:auto;user-select:all;">Waiting for code...</div>
    <button id="copyBtn" class="btn" onclick="copyAuthCode()">📋 Copy Code</button>
    <div id="statusMsg" style="margin-top:12px;font-size:13px;color:#10b981;"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const display = document.getElementById('codeDisplay');
    const btn = document.getElementById('copyBtn');
    const status = document.getElementById('statusMsg');

    if (code) {
      display.textContent = code;
      try {
        navigator.clipboard.writeText(code).then(() => {
          status.textContent = "✅ Copied to clipboard automatically!";
        });
      } catch (e) {}
    } else {
      display.textContent = "No authorization code found in URL.";
      btn.style.display = "none";
    }

    function copyAuthCode() {
      if (code) {
        navigator.clipboard.writeText(code).then(() => {
          status.textContent = "✅ Copied to clipboard!";
          btn.textContent = "Copied! ✅";
        });
      }
    }
  </script>
</body>
</html>
