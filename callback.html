<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FeverLoop - Authorization Successful</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #09090b;
      color: #f4f4f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #141417;
      border: 1px solid #27272a;
      border-radius: 16px;
      padding: 40px 30px;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 { color: #10b981; margin: 15px 0 10px; font-size: 24px; font-weight: 700; }
    p { color: #a1a1aa; font-size: 15px; line-height: 1.5; margin-bottom: 24px; }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #27272a;
      border-top-color: #fe2c55;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      display: inline-block;
      background: #fe2c55;
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size: 48px;">🎉</div>
    <h1>TikTok Account Connected!</h1>
    <p>Authorization was successful for <b>@feverloop6</b>.<br>Redirecting you back to FeverLoop Studio...</p>
    <div class="spinner"></div>
    <a href="index.html?connected=true" class="btn">Return to Studio &rarr;</a>
  </div>

  <script>
    // Auto redirect after 1.8 seconds for smooth video demo recording
    setTimeout(() => {
      window.location.href = "index.html?connected=true";
    }, 1800);
  </script>
</body>
</html>
