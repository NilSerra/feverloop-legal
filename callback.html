<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FeverLoop - Authorization Successful</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f0f12;
      color: #e4e4e7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 16px;
      padding: 40px 30px;
      max-width: 520px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 { color: #22c55e; margin: 15px 0 10px; font-size: 24px; }
    p { color: #a1a1aa; font-size: 15px; }
    .code-box {
      background: #09090b;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      padding: 12px;
      font-family: monospace;
      font-size: 14px;
      color: #38bdf8;
      word-break: break-all;
      margin: 20px 0;
      cursor: pointer;
      user-select: all;
    }
    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    .btn:hover { background: #2563eb; }
    .status { margin-top: 10px; font-size: 13px; color: #10b981; }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size: 48px;">🎉</div>
    <h1>TikTok Connected!</h1>
    <p>Authorization was successful. Your authorization code is below:</p>
    <div id="codeDisplay" class="code-box">Waiting for code...</div>
    <button class="btn" onclick="copyCode()">Copy Code</button>
    <div id="statusMsg" class="status"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const display = document.getElementById('codeDisplay');
    if (code) {
      display.textContent = code;
    } else {
      display.textContent = "No code found in URL. Please check the authorization link.";
    }

    function copyCode() {
      if (code) {
        navigator.clipboard.writeText(code).then(() => {
          document.getElementById('statusMsg').textContent = "Copied to clipboard!";
        });
      }
    }
  </script>
</body>
</html>
